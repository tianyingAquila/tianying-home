<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <title>游戏终端 · Tianying的巢</title>
  <meta name="description" content="Tianying 的小站游戏终端：技能扫雷与网格塔防。">
  <link rel="stylesheet" href="assets/css/tokens.css?v=2">
  <link rel="stylesheet" href="assets/css/style.css?v=18">
  <link rel="stylesheet" href="assets/css/terminal.css?v=2">
  <link rel="stylesheet" href="assets/css/games.css?v=3">
</head>
<body class="games-page" data-theme="light">

  <header class="site-header">
    <a class="site-brand" href="index.html">
      <span class="brand-mark"></span>
      <span>Tianying的巢</span>
    </a>
    <div class="header-actions">
      <nav class="site-nav-links" aria-label="主导航">
        <a class="nav-link" href="index.html">首页</a>
        <a class="nav-link" href="projects.html">项目</a>
        <a class="nav-link is-current" href="games.html" aria-current="page">游戏</a>
      </nav>
    </div>
  </header>

  <main class="hub-stage">
    <div class="term-head">
      <div class="term-brand">
        <strong>TIANYING GAMES</strong>
        <span>SELECT A PROGRAM</span>
        <strong>GAME OS</strong>
      </div>

      <div class="term-tools">
        <div class="term-readout">
          <span class="term-clock" id="termClock">--:--:--</span>
          <span class="term-status">2 PROGRAMS</span>
        </div>
      </div>
    </div>

    <ul class="hub-list">
      <li class="hub-item">
        <a class="hub-card" href="minesweeper.html">
          <span class="hub-no">G-001</span>
          <span class="hub-body">
            <span class="hub-title">技能扫雷</span>
            <span class="hub-en">SKILL MINESWEEPER</span>
            <span class="hub-desc">三档棋盘，27 个正负面效果随机上身。连锁结算、三次提示、成绩上榜。</span>
          </span>
          <span class="hub-meta">
            <span class="hub-tag">PUZZLE</span>
            <span class="hub-enter">ACCESS <i aria-hidden="true"></i></span>
          </span>
        </a>
      </li>

      <li class="hub-item">
        <a class="hub-card" href="tower.html">
          <span class="hub-no">G-002</span>
          <span class="hub-body">
            <span class="hub-title">网格塔防</span>
            <span class="hub-en">GRID DEFENSE</span>
            <span class="hub-desc">三张地图：单线、双线交错、三线汇流。六类塔三级强化，每张图最后三波才是真正的考验。</span>
          </span>
          <span class="hub-meta">
            <span class="hub-tag">STRATEGY</span>
            <span class="hub-enter">ACCESS <i aria-hidden="true"></i></span>
          </span>
        </a>
      </li>
    </ul>

    <p class="hub-foot">POWERED BY TIANYING ARCHIVE <span class="hub-foot-rule" aria-hidden="true"></span></p>
  </main>

  <script src="assets/js/clock.js?v=1"></script>
</body>
</html>
